# Ydisks 闲鱼助手 HTTPS 反向代理模板
# 使用前请替换 server_name、ssl_certificate 和 ssl_certificate_key。
# 本配置只监听 443，不包含 80 端口，也不做 HTTP 重定向。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # 使用 IP 访问时可保留 _；使用域名时改成实际域名。
    server_name _;

    # 模拟证书路径，请替换为真实证书和私钥路径。
    ssl_certificate     /etc/nginx/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # 管理后台可能上传图片、压缩包或批量商品文件。
    client_max_body_size 100m;

    location / {
        # FRP 在 ubuntu_server 本机暴露的 59188 端口。
        proxy_pass http://127.0.0.1:59188;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 支持 WebSocket 长连接。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}